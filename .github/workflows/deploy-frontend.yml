name: Deploy Frontend

on:
  push:
    branches: [dev, qa, main]
    paths:
      - 'MeritLense-ui/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: MeritLense-ui/package-lock.json

      - name: Install dependencies
        working-directory: MeritLense-ui
        run: npm ci

      - name: Determine API URL
        id: env
        run: |
          if [ "${{ github.ref }}" = "refs/heads/dev" ]; then
            echo "api_url=https://meritlense-api-dev.azurewebsites.net/api/v1" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/qa" ]; then
            echo "api_url=https://meritlense-api-qa.azurewebsites.net/api/v1" >> "$GITHUB_OUTPUT"
          else
            echo "api_url=https://api.meritlense.com/api/v1" >> "$GITHUB_OUTPUT"
          fi

      - name: Build static export
        working-directory: MeritLense-ui
        env:
          NEXT_PUBLIC_API_URL: ${{ steps.env.outputs.api_url }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_STATIC_EXPORT: 'true'
        run: npx next build

      - name: Copy routing config to output
        run: cp MeritLense-ui/staticwebapp.config.json MeritLense-ui/out/staticwebapp.config.json

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: MeritLense-ui/out

  deploy-dev:
    needs: build
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: out

      - name: Deploy to Dev
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_TOKEN_DEV }}
          action: upload
          app_location: out
          skip_app_build: true

  deploy-qa:
    needs: build
    if: github.ref == 'refs/heads/qa'
    runs-on: ubuntu-latest
    environment: qa

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: out

      - name: Deploy to QA
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_TOKEN_QA }}
          action: upload
          app_location: out
          skip_app_build: true

  deploy-prod:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: out

      - name: Deploy to Production
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_TOKEN_PROD }}
          action: upload
          app_location: out
          skip_app_build: true
