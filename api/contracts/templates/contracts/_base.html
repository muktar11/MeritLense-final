<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  @page { size: A4; margin: 2.2cm 2cm; }
  body { font-family: "Helvetica Neue", Arial, sans-serif; font-size: 11pt; color: #1a1a1a; line-height: 1.5; }
  h1 { font-size: 18pt; color: #6d28d9; margin-bottom: 0.2em; }
  h2 { font-size: 13pt; color: #4c1d95; margin-top: 1.4em; }
  .doc-meta { color: #555; font-size: 9.5pt; margin-bottom: 1.5em; }
  .doc-meta span { display: block; }
  .field { background: #f5f3ff; padding: 1px 4px; border-radius: 3px; font-weight: 600; }
  .placeholder-notice {
    background: #fef3c7; border: 1px solid #f59e0b; color: #92400e;
    padding: 8px 12px; border-radius: 6px; font-size: 9.5pt; margin-bottom: 1.5em;
  }
  .signature-block { margin-top: 2.5em; padding-top: 1em; border-top: 1px solid #ddd; }

  .ml-seal {
    margin-top: 2.5em; padding: 12px 16px; border: 1.5px solid #6d28d9;
    border-radius: 8px; background: #faf9ff; page-break-inside: avoid;
  }
  .ml-seal-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .ml-seal-wordmark { font-size: 13pt; font-weight: 700; color: #1a1a1a; }
  .ml-seal-wordmark-accent { color: #6d28d9; }
  .ml-seal-title { font-size: 9pt; color: #6d28d9; font-weight: 600; }
  .ml-seal-table { font-size: 8.5pt; color: #333; border-collapse: collapse; }
  .ml-seal-table td { padding: 1px 6px 1px 0; }
  .ml-seal-table td:first-child { color: #777; white-space: nowrap; }
  .ml-seal-qr { width: 70px; height: 70px; position: absolute; right: 24px; margin-top: -60px; }
  .ml-seal-stamp { width: 90px; height: 90px; opacity: 0.85; position: absolute; right: 110px; margin-top: -75px; }
  .ml-seal-preview { border-style: dashed; background: #fafafa; }
  .ml-seal-preview .ml-seal-title { color: #999; }
  .ml-seal-preview-note { font-size: 8.5pt; color: #888; margin: 0; }
</style>
</head>
<body>
{% block content %}{% endblock %}
</body>
</html>
