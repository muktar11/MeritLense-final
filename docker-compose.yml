services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    container_name: meritlense_azurite
    command: azurite-queue --queueHost 0.0.0.0 --location /data
    environment:
      - AZURITE_ACCOUNTS=meritlense:bG9jYWwtbWVyaXRsZW5zZS1henVyaXRlLWtleQ==
    volumes:
      - azurite_data:/data
    ports:
      - "10001:10001"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: meritlense_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: meritlense_db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=meritlense_db     
      - POSTGRES_USER=merit_user 
      - POSTGRES_PASSWORD=meritlense_password
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U merit_user -d meritlense_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: meritlense_web
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        sleep 10 &&
        echo 'Running migrations...' &&
        python manage.py migrate &&
        echo 'Creating superuser...' &&
        python /app/create_superuser.py &&
        echo 'Starting server...' &&
        python manage.py runserver 0.0.0.0:8000
      "
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8020:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=meritlense.settings
      - DJANGO_SECRET_KEY=django-insecure-local-docker-change-me
      - DEBUG=True
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - DJANGO_SUPERUSER_EMAIL=admin@meritlense.com
      - DJANGO_SUPERUSER_PASSWORD=Admin@123
      - DJANGO_SUPERUSER_FIRST_NAME=Super
      - DJANGO_SUPERUSER_LAST_NAME=Admin
      - DB_NAME=meritlense_db
      - DB_USER=merit_user
      - DB_PASSWORD=meritlense_password
      - DB_HOST=db
      - DB_PORT=5432
      - AZURE_QUEUE_CONNECTION_STRING=DefaultEndpointsProtocol=http;AccountName=meritlense;AccountKey=bG9jYWwtbWVyaXRsZW5zZS1henVyaXRlLWtleQ==;QueueEndpoint=http://azurite:10001/meritlense;
      - AZURE_STORAGE_CONNECTION_STRING=
      - AZURE_STORAGE_CONTAINER_NAME=meritlense-media
      - AZURE_DEFAULT_QUEUE_NAME=meritlense-jobs
      - AZURE_QUEUE_POISON_NAME=meritlense-jobs-poison
      - ENABLE_ASYNC_AI_PROCESSING=True
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      azurite:
        condition: service_started
    restart: unless-stopped

  ai-worker:
    build: .
    container_name: meritlense_ai_worker
    command: python manage.py run_ai_queue_worker
    volumes:
      - .:/app
      - media_volume:/app/media
    environment:
      - DJANGO_SETTINGS_MODULE=meritlense.settings
      - DJANGO_SECRET_KEY=django-insecure-local-docker-change-me
      - DEBUG=True
      - DB_NAME=meritlense_db
      - DB_USER=merit_user
      - DB_PASSWORD=meritlense_password
      - DB_HOST=db
      - DB_PORT=5432
      - AZURE_QUEUE_CONNECTION_STRING=DefaultEndpointsProtocol=http;AccountName=meritlense;AccountKey=bG9jYWwtbWVyaXRsZW5zZS1henVyaXRlLWtleQ==;QueueEndpoint=http://azurite:10001/meritlense;
      - AZURE_DEFAULT_QUEUE_NAME=meritlense-jobs
      - AZURE_QUEUE_POISON_NAME=meritlense-jobs-poison
      - ENABLE_ASYNC_AI_PROCESSING=True
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GOOGLE_TRANSLATE_API_KEY=${GOOGLE_TRANSLATE_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      azurite:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres_data:
  static_volume:
  media_volume:
  azurite_data:
